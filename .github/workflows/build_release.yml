name: Android Release Build & Sign

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Make gradlew executable
        run: chmod +x gradlew

      - name: 4. Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PWD_TO_USE="${STORE_PWD:-quizmaster2026}"
          KEY_TO_USE="${KEY_PWD:-quizmaster2026}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            echo "Generating production release upload keystore for build..."
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "$PWD_TO_USE" \
              -keypass "$KEY_TO_USE" \
              -dname "CN=Quiz Master, OU=Mobile, O=AIStudio, L=Dhaka, S=Dhaka, C=BD"
          fi

          # Ensure the keystore is available in BOTH root and app/ directory
          cp "${GITHUB_WORKSPACE}/my-upload-key.jks" "${GITHUB_WORKSPACE}/app/my-upload-key.jks"
          echo "Keystore successfully prepared at both:"
          ls -la "${GITHUB_WORKSPACE}/my-upload-key.jks"
          ls -la "${GITHUB_WORKSPACE}/app/my-upload-key.jks"

      - name: 5. Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'quizmaster2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'quizmaster2026' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: 6. Build Signed Release AAB (App Bundle)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'quizmaster2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'quizmaster2026' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          ./gradlew :app:bundleRelease --stacktrace

      - name: 7. Copy & Rename Binaries for Clear Identification
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/QuizMaster-v1.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-output/QuizMaster-v1.0-release.aab
          echo "Release files ready:"
          ls -lh release-output/

      - name: 8. Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizMaster-Signed-APK
          path: release-output/QuizMaster-v1.0-release.apk

      - name: 9. Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizMaster-Signed-AAB
          path: release-output/QuizMaster-v1.0-release.aab

      - name: 10. Publish GitHub Release with Direct APK & AAB Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Quiz Master Production Release v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-output/QuizMaster-v1.0-release.apk
            release-output/QuizMaster-v1.0-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


name: Android Release Build & Sign

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Prepare Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Keystore decoded from secret."
          else
            echo "No KEYSTORE_BASE64 found, generating automated upload keypair for CI build..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "${{ secrets.STORE_PASSWORD || 'quizmaster2026' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'quizmaster2026' }}" \
              -dname "CN=Quiz Master CI, OU=Mobile, O=AIStudio, L=Dhaka, C=BD"
          fi

      - name: 4. Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'quizmaster2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'quizmaster2026' }}
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:assembleRelease || gradle :app:assembleRelease

      - name: 5. Build Signed Release AAB (App Bundle)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'quizmaster2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'quizmaster2026' }}
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          ./gradlew :app:bundleRelease || gradle :app:bundleRelease

      - name: 6. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: 7. Publish GitHub Release (On Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
